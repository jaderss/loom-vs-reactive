name: loom-vs-reactive

x-app: &app
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEMORY_MB:-1536}m
  volumes:
    - ./results:/results
  depends_on:
    postgres:
      condition: service_healthy
    toxiproxy:
      condition: service_started
    mock:
      condition: service_started
  environment: &app-env
    DB_HOST: toxiproxy
    DB_PORT: 5432
    DB_NAME: bench
    DB_USER: bench
    DB_PASSWORD: bench
    POOL_SIZE: ${POOL_SIZE:-20}
    DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-2000}
    DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-2000}
    DB_SOCKET_TIMEOUT_S: ${DB_SOCKET_TIMEOUT_S:-5}
    DOWNSTREAM_TIMEOUT_MS: ${DOWNSTREAM_TIMEOUT_MS:-1000}
    RATES_URL: http://mock:8080
    JAVA_OPTS: -XX:+Use${JVM_GC:-ParallelGC} -XX:MaxRAMPercentage=${HEAP_PERCENT:-75} ${JAVA_OPTS:-}

x-mvc: &mvc
  <<: *app
  build:
    context: apps/mvc
    args:
      JAVA_VERSION: ${JAVA_VERSION:-25}
  image: lvr/mvc:java${JAVA_VERSION:-25}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.6}
    cpus: ${POSTGRES_CPUS:-2}
    shm_size: 256m
    ports: ["${POSTGRES_PORT:-15432}:5432"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
      SEED_ACCOUNTS: ${SEED_ACCOUNTS:-100000}
      SEED_TXN_PER_ACCOUNT: ${SEED_TXN_PER_ACCOUNT:-50}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bench", "-d", "bench"]
      interval: 2s
      timeout: 2s
      retries: 300

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:${TOXIPROXY_VERSION:-2.13.0}
    cpus: ${TOXIPROXY_CPUS:-1}
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./db/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["${TOXIPROXY_PORT:-8474}:8474"]
    depends_on:
      postgres:
        condition: service_healthy

  mock:
    build:
      context: mock
      args:
        GO_VERSION: ${GO_VERSION:-1.27}
    image: lvr/mock:go${GO_VERSION:-1.27}
    cpus: ${MOCK_CPUS:-1}
    environment:
      MOCK_LATENCY: ${MOCK_LATENCY:-30ms}
      MOCK_JITTER: ${MOCK_JITTER:-10ms}
      MOCK_RATE: ${MOCK_RATE:-1.0900}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0}
    ports: ["${MOCK_PORT:-8090}:8080"]

  mvc-vt:
    <<: *mvc
    environment:
      <<: *app-env
      VIRTUAL_THREADS: "true"
      LEGACY_LOCK: ${LEGACY_LOCK:-false}
      LEGACY_LOCK_STRIPES: ${LEGACY_LOCK_STRIPES:-1024}
    ports: ["8081:8080"]

  mvc-platform:
    <<: *mvc
    environment:
      <<: *app-env
      VIRTUAL_THREADS: "false"
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      FANOUT_THREADS: ${FANOUT_THREADS:-600}
    ports: ["8082:8080"]

  webflux:
    <<: *app
    build:
      context: apps/webflux
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
    image: lvr/webflux:java${JAVA_VERSION:-25}
    ports: ["8083:8080"]

  coroutines:
    <<: *app
    build:
      context: apps/coroutines
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
    image: lvr/coroutines:java${JAVA_VERSION:-25}
    ports: ["8084:8080"]

  go:
    <<: *app
    build:
      context: apps/go
      args:
        GO_VERSION: ${GO_VERSION:-1.27}
    image: lvr/go:${GO_VERSION:-1.27}
    ports: ["8085:8080"]

  dashboard:
    build:
      context: dashboard
      args:
        NODE_VERSION: ${NODE_VERSION:-26}
        NGINX_VERSION: ${NGINX_VERSION:-1.31}
    image: lvr/dashboard
    ports: ["${DASHBOARD_PORT:-8080}:80"]
    volumes:
      - ./results:/usr/share/nginx/html/results:ro

  loadgen:
    profiles: [tools]
    build:
      context: .
      dockerfile: loadgen/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.27}
    image: lvr/loadgen:go${GO_VERSION:-1.27}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cpus: ${LOADGEN_CPUS:-2}
    volumes:
      - ./results:/results
    environment:
      TARGET: ${TARGET:-http://go:8080}
      SCENARIO: ${SCENARIO:-statement}
      APP_LABEL: ${APP_LABEL:-}
      USERS: ${USERS:-2000}
      THINK_TIME: ${THINK_TIME:-1s}
      DURATION: ${DURATION:-60s}
      RAMP_UP: ${RAMP_UP:-15s}
      ARRIVAL_RATES: ${ARRIVAL_RATES:-1000 2000 4000 8000}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      SAMPLE_EVERY: ${SAMPLE_EVERY:-100}
      STATEMENT_LIMIT: ${STATEMENT_LIMIT:-20}
      SEED_ACCOUNTS: ${SEED_ACCOUNTS:-100000}
      SEED_TXN_PER_ACCOUNT: ${SEED_TXN_PER_ACCOUNT:-50}
      MOCK_RATE: ${MOCK_RATE:-1.0900}
      RUN_ID: ${RUN_ID:-local}

  contract:
    profiles: [tools]
    image: golang:${GO_VERSION:-1.27}
    working_dir: /src/contract
    volumes:
      - .:/src:ro
    environment:
      BASE_URL: ${BASE_URL:-http://go:8080}
      MOCK_URL: http://mock:8080
      TOXIPROXY_URL: http://toxiproxy:8474
      SEED_ACCOUNTS: ${SEED_ACCOUNTS:-100000}
      SEED_TXN_PER_ACCOUNT: ${SEED_TXN_PER_ACCOUNT:-50}
      MOCK_RATE: ${MOCK_RATE:-1.0900}
      MOCK_LATENCY: ${MOCK_LATENCY:-30ms}
      MOCK_JITTER: ${MOCK_JITTER:-10ms}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-2000}
      DB_SOCKET_TIMEOUT_S: ${DB_SOCKET_TIMEOUT_S:-5}
      DOWNSTREAM_TIMEOUT_MS: ${DOWNSTREAM_TIMEOUT_MS:-1000}
      GOFLAGS: -buildvcs=false
      GOCACHE: /tmp/gocache
    command: ["go", "test", "-count=1", "-v", "./..."]
