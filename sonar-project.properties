sonar.test.inclusions=**/*_test.go,apps/*/src/test/**,contract/**

sonar.java.source=25
sonar.java.binaries=apps/mvc/target/classes,apps/webflux/target/classes,apps/coroutines/target/classes
sonar.java.test.binaries=apps/mvc/target/test-classes,apps/webflux/target/test-classes,apps/coroutines/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=apps/mvc/target/site/jacoco/jacoco.xml,apps/webflux/target/site/jacoco/jacoco.xml,apps/coroutines/target/site/jacoco/jacoco.xml
sonar.go.coverage.reportPaths=mock/coverage.out,loadgen/coverage.out
