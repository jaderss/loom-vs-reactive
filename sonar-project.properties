sonar.projectKey=jaderss_loom-vs-reactive
sonar.organization=jaderss
sonar.projectName=loom-vs-reactive

sonar.sources=.
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,results/**,docs/**,db/**,**/*_test.go,apps/*/src/test/**,contract/**,**/mvnw*,**/.mvn/**
sonar.coverage.exclusions=dashboard/**
